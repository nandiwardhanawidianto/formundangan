<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#fcf8f3"/><title>Pratinjau Form Undangan | Royal Wedding Invitation</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#302b28;background:#fcf8f3;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -20%,#fae9df,transparent 65%),#fcf8f3}
header{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #eee4d9;background:rgba(255,252,247,.9)}
.brand{display:flex;gap:12px;align-items:center}.mark{font-family:Georgia,serif;border:1px solid #b27f69;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-size:26px;color:#ab745c}.brand strong{display:block;font-size:13px;letter-spacing:2px}.brand small{font-size:9px;letter-spacing:2px;color:#a18673}
.shell{max-width:560px;margin:0 auto;padding:26px 16px 38px}.notice{padding:10px 14px;background:#fff4d9;color:#75522a;border:1px solid #ead09c;border-radius:12px;font-size:12px;margin-bottom:15px;line-height:1.5;text-align:center}
.panel{background:#fff;box-shadow:0 16px 65px rgba(106,73,53,.08);border:1px solid #f0e6dc;border-radius:26px;padding:clamp(22px,5vw,42px);min-height:430px;display:flex;flex-direction:column}
.kicker{font-size:10px;text-transform:uppercase;color:#af805f;letter-spacing:2.7px;font-weight:750;margin:0 0 17px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(31px,6.5vw,43px);line-height:1.17;letter-spacing:-.8px;margin:0 0 15px}
h1 em{color:#b7836a}.description{font-size:14px;line-height:1.7;color:#786f67;margin:0 0 28px}
.progress{display:flex;justify-content:space-between;font-size:11px;font-weight:650;color:#8e7d71;letter-spacing:.15px;margin:0 0 8px}
.track{height:5px;background:#f0e6dc;border-radius:9px;overflow:hidden;margin-bottom:26px}.fill{height:100%;background:#b7836a;transition:width .24s ease;border-radius:9px}
.formarea{flex:1}.field{display:block;margin:0 0 18px}.field span{display:block;font-size:13px;font-weight:650;margin:0 0 9px}.field small{display:block;font-size:12px;line-height:1.5;color:#86786a;margin:7px 0 0}
.field input,.field textarea,.field select{width:100%;padding:14px 14px;border:1px solid #ded5ca;background:#fefdfb;border-radius:12px;font:inherit;font-size:15px;color:#332d28;outline:none}
.field textarea{min-height:95px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#b7836a;box-shadow:0 0 0 3px #b7836a20}
.options{display:grid;gap:12px;margin:2px 0 15px}.option{background:#fffdfb;border:1px solid #e9ded2;border-radius:15px;padding:17px;text-align:left;font:inherit;cursor:pointer;color:inherit;font-weight:650;font-size:14px}
.option small{display:block;color:#8c7c6d;font-size:12px;font-weight:400;margin-top:4px}.option.selected{border-color:#af7961;background:#fbf3ec;box-shadow:0 0 0 1px #af7961}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:25px;padding-top:22px;border-top:1px solid #f0e8e0}.btn{border:1px solid #e5dcd3;border-radius:12px;padding:13px 17px;background:#fff;color:#584b43;font-weight:650;font-size:13px;font-family:inherit;cursor:pointer;min-height:48px}.btn.primary{background:#9f6c56;color:white;border-color:#9f6c56;flex:1}.btn.soft{background:#f7f0e8;border-color:#f7f0e8}.btn:active{transform:translateY(1px)}button:disabled{opacity:.4;cursor:default}
.help{font-size:12px;line-height:1.6;color:#918478;margin-top:18px;text-align:center}
.tip{border:1px solid #ebdfd2;border-radius:14px;padding:15px;background:#fcf9f5;font-size:12px;line-height:1.6;color:#716152;margin-bottom:20px}
.tip strong{color:#584a3d}.error{font-size:12px;color:#a22f30;margin:12px 0}.review{display:grid;gap:10px}.review div{padding:12px 0;border-bottom:1px solid #f1e9e0;display:flex;justify-content:space-between;gap:12px;font-size:12px}.review strong{text-align:right;font-size:12px;color:#574636;max-width:58%;overflow-wrap:anywhere}.success{border:1px solid #ddeddf;color:#375b3b;background:#f5fcf5;border-radius:14px;padding:17px;font-size:14px;line-height:1.7}
footer{text-align:center;color:#96877b;font-size:11px;margin-top:24px}
.topbutton{background:transparent;border:1px solid #decfbe;color:#936a54;border-radius:18px;font-size:11px;font-weight:700;padding:9px 12px;cursor:pointer;position:relative}.count{background:#b97362;color:white;border-radius:20px;padding:2px 5px;margin-left:5px}
@media(max-width:500px){header{height:66px;padding:0 15px}.shell{padding:14px 10px 28px}.panel{border-radius:21px;min-height:calc(100dvh - 170px);padding:24px 19px}.notice{font-size:11px}.brand strong{font-size:10px}.brand small{font-size:8px}.mark{height:35px;width:35px;font-size:23px}.actions{gap:7px}.actions .btn{padding:11px 13px}}
</style></head><body>
<header><div class="brand"><div class="mark">R</div><div><strong>ROYAL WEDDING</strong><small>INVITATION</small></div></div><button class="topbutton" id="admin" type="button">🔔 Admin <span class="count" id="count">0</span></button></header>
<main class="shell"><div class="notice">MODE PRATINJAU — Jangan masukkan data pelanggan asli. Data tidak dikirim ke server dan hilang saat halaman dimuat ulang.</div><section class="panel" id="panel"></section><footer>Royal Wedding Invitation · Pratinjau antarmuka seluler</footer></main>
<script>
(function(){
'use strict';
var data={order:'',wa:'',shop:'',type:'',photo:'',display:'wanita',groom:'',gshort:'',gorder:'',gfather:'',gmom:'',bride:'',bshort:'',border:'',bfather:'',bmom:'',pengangkat:'',turut:'',bank:'',rekening:'',atasnama:'',kado:'',kadotel:'',kadoalamat:'',files:[]};
for(var i=1;i<=3;i++){data['event'+i]='';data['date'+i]='';data['time'+i]='';data['loc'+i]='';data['map'+i]='';}
var steps=[],index=-1,submitted=0,adminView=false,errors='',panel=document.getElementById('panel');
var spec=[
{id:'product',title:'Pilih jenis undangan',desc:'Sesuaikan dengan produk yang dibeli di Shopee.',fields:[{key:'type',type:'choice',label:'Jenis Undangan',options:[['digital','Undangan Digital Website','Undangan dalam bentuk website'],['print','Undangan Cetak','Undangan fisik yang dicetak']]}]},
{id:'photo',title:'Pilih paket foto',desc:'Pastikan pilihan ini sama dengan pesanan Shopee.',fields:[{key:'photo',type:'choice',label:'Jenis Paket',options:[['yes','Dengan Foto','Maksimal 10 foto'],['no','Tanpa Foto','Tidak menggunakan foto']]}]},
{id:'shop',title:'Informasi tambahan',desc:'Data akun Shopee dan urutan nama mempelai.',fields:[{key:'shop',label:'Nama Akun Shopee',placeholder:'Nama akun di Shopee'},{key:'display',type:'choice',label:'Urutan nama mempelai',options:[['wanita','Wanita – Pria'],['pria','Pria – Wanita']]}]},
{id:'groom',title:'Mempelai pria',desc:'Isi nama sesuai pesanan Anda.',fields:[{key:'groom',label:'Nama Lengkap Pria'},{key:'gshort',label:'Nama Pendek / Panggilan'}]},
{id:'gparents',title:'Orang tua mempelai pria',desc:'Boleh dikosongkan jika belum diketahui.',fields:[{key:'gorder',label:'Putra keberapa',placeholder:'Contoh: pertama'},{key:'gfather',label:'Nama Ayah'},{key:'gmom',label:'Nama Ibu'}]},
{id:'bride',title:'Mempelai wanita',desc:'Isi nama sesuai pesanan Anda.',fields:[{key:'bride',label:'Nama Lengkap Wanita'},{key:'bshort',label:'Nama Pendek / Panggilan'}]},
{id:'bparents',title:'Orang tua mempelai wanita',desc:'Boleh dikosongkan jika belum diketahui.',fields:[{key:'border',label:'Putri keberapa',placeholder:'Contoh: kedua'},{key:'bfather',label:'Nama Ayah'},{key:'bmom',label:'Nama Ibu'}]}
];
for(var k=1;k<=3;k++){
spec.push({id:'eventa'+k,title:'Acara '+k,desc:'Nama acara bebas. Kosongkan jika tidak digunakan.',fields:[{key:'event'+k,label:'Nama Acara',placeholder:'Contoh: Akad Nikah'},{key:'date'+k,label:'Tanggal Acara',type:'date'}]});
spec.push({id:'eventb'+k,title:'Acara '+k+' — Detail',desc:'Waktu dan lokasi boleh diisi nanti.',fields:[{key:'time'+k,label:'Waktu',placeholder:'Contoh: 08.00 WIB – Selesai'},{key:'loc'+k,label:'Lokasi / Alamat Lengkap',type:'textarea'},{key:'map'+k,label:'Link Google Maps',placeholder:'https://maps.app.goo.gl/...'}]});
}
spec.push({id:'pengangkat',title:'Pengangkat Hajat',desc:'Tulis satu nama pada setiap baris.',fields:[{key:'pengangkat',label:'Nama Pengangkat Hajat',type:'textarea'}]});
spec.push({id:'turut',title:'Turut Mengundang',desc:'Bagian ini opsional. Tulis satu nama pada setiap baris.',fields:[{key:'turut',label:'Daftar Turut Mengundang',type:'textarea'}]});
spec.push({id:'gift',title:'Love Gift',desc:'Khusus untuk undangan digital.',fields:[{key:'bank',label:'Nama Bank'},{key:'rekening',label:'Nomor Rekening'},{key:'atasnama',label:'Nama Pemilik Rekening'}]});
spec.push({id:'delivery',title:'Kirim Kado',desc:'Khusus untuk undangan digital.',fields:[{key:'kado',label:'Nama Penerima'},{key:'kadotel',label:'Nomor WhatsApp Penerima',type:'tel'},{key:'kadoalamat',label:'Alamat Penerima',type:'textarea'}]});
spec.push({id:'upload',title:'Unggah Foto',desc:'Maksimal 10 JPG, JPEG, atau PNG. Maksimal 7 MB per foto.',fields:[{key:'files',type:'file',label:'Pilih Foto'}]});
spec.push({id:'review',title:'Periksa data undangan',desc:'Anda tetap boleh mengajukan data meski belum lengkap.',fields:[]});
function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function allSteps(){return spec.filter(function(s){if(s.id==='photo'||s.id==='gift'||s.id==='delivery'||s.id==='upload')return data.type==='digital'&&(s.id==='photo'||s.id==='gift'||s.id==='delivery'||(data.photo==='yes'&&s.id==='upload'));return true;});}
function btn(txt,cls,fn,disabled){var el=document.createElement('button');el.type='button';el.className='btn '+(cls||'');el.textContent=txt;el.disabled=!!disabled;el.addEventListener('click',fn);return el;}
function div(cls){var el=document.createElement('div');el.className=cls||'';return el;}
function heading(title,desc,kicker){var top=document.createElement('p');top.className='kicker';top.textContent=kicker||'ROYAL WEDDING INVITATION';panel.appendChild(top);var h=document.createElement('h1');h.textContent=title;panel.appendChild(h);var p=document.createElement('p');p.className='description';p.textContent=desc;panel.appendChild(p);}
function addField(f,target){if(f.type==='choice'){var group=div('field'),ttl=document.createElement('span');ttl.textContent=f.label;group.appendChild(ttl);var opts=div('options');f.options.forEach(function(o){var ob=document.createElement('button');ob.type='button';ob.className='option'+(data[f.key]===o[0]?' selected':'');ob.appendChild(document.createTextNode(o[1]));if(o[2]){var sm=document.createElement('small');sm.textContent=o[2];ob.appendChild(sm);}ob.addEventListener('click',function(){data[f.key]=o[0];if(f.key==='type'){data.photo='';}render();});opts.appendChild(ob);});group.appendChild(opts);target.appendChild(group);return;}
var wrap=div('field'),lab=document.createElement('span');lab.textContent=f.label;wrap.appendChild(lab);
if(f.type==='file'){var fi=document.createElement('input');fi.type='file';fi.multiple=true;fi.accept='.jpg,.jpeg,.png,image/jpeg,image/png';fi.addEventListener('change',function(){var fs=Array.from(fi.files);if(fs.some(function(x){return x.size>7*1024*1024||!['image/jpeg','image/png'].includes(x.type);})){errors='File harus JPG, JPEG, atau PNG dan maksimal 7 MB per foto.';return render();}if(data.files.length+fs.length>10){errors='Maksimal 10 foto.';return render();}data.files=data.files.concat(fs.map(function(x){return x.name;}));errors='';render();});wrap.appendChild(fi);var fp=document.createElement('small');fp.textContent=data.files.length+' dari 10 foto dipilih (pratinjau saja, tidak diunggah).';wrap.appendChild(fp);if(data.files.length){wrap.appendChild(btn('Hapus pilihan foto','soft',function(){data.files=[];render();}));}target.appendChild(wrap);return;}
var input=f.type==='textarea'?document.createElement('textarea'):document.createElement('input');if(f.type!=='textarea'){input.type=f.type||'text';}input.placeholder=f.placeholder||'';input.value=data[f.key]||'';input.addEventListener('input',function(){data[f.key]=input.value;});wrap.appendChild(input);target.appendChild(wrap);
}
function error(){if(errors){var p=document.createElement('p');p.className='error';p.textContent=errors;panel.appendChild(p);}}
function actions(buttons){var line=div('actions');buttons.forEach(function(b){line.appendChild(b);});panel.appendChild(line);}
function checkPage(){errors='';if(!data.order.trim()||!data.wa.trim()){errors='Nomor pesanan dan nomor WhatsApp wajib diisi.';render();return;}if(!/^(\+?62|0)[0-9]{8,15}$/.test(data.wa.replace(/[\s-]/g,''))){errors='Periksa kembali nomor WhatsApp Anda.';render();return;}index=0;render();}
function render(){adminView=false;panel.replaceChildren();var tag=document.getElementById('count');tag.textContent=String(submitted);
if(index===-1){heading('Setiap kisah cinta punya awal yang indah.','Isi data undangan satu langkah setiap kali. Tidak perlu mengisi semuanya sekaligus.','FORMULIR PELANGGAN · PRATINJAU');var top=div('formarea');var tip=div('tip');tip.innerHTML='<strong>Cara menemukan nomor pesanan</strong><br>Buka Shopee → Saya → Pesanan Saya → pilih pesanan undangan → lihat Nomor Pesanan. Gambar panduan asli akan ditambahkan saat peluncuran.';top.appendChild(tip);addField({key:'order',label:'Nomor Pesanan Shopee'},top);addField({key:'wa',label:'Nomor WhatsApp Aktif',type:'tel',placeholder:'081234567890'},top);panel.appendChild(top);error();actions([btn('Lanjut →','primary',checkPage)]);return;}
steps=allSteps();if(index>=steps.length)index=steps.length-1;var step=steps[index];var pro=div('progress');var a=document.createElement('span'),b=document.createElement('span');a.textContent='Langkah '+(index+1)+' dari '+steps.length;b.textContent=Math.round((index+1)/steps.length*100)+'%';pro.appendChild(a);pro.appendChild(b);panel.appendChild(pro);var track=div('track'),fill=div('fill');fill.style.width=((index+1)/steps.length*100)+'%';track.appendChild(fill);panel.appendChild(track);heading(step.title,step.desc,'DATA UNDANGAN');var fields=div('formarea');step.fields.forEach(function(f){addField(f,fields);});
if(step.id==='review'){var summary=div('review');[['Nomor Pesanan',data.order],['WhatsApp',data.wa],['Produk',data.type==='digital'?'Undangan Digital '+(data.photo==='yes'?'Dengan Foto':'Tanpa Foto'):'Undangan Cetak'],['Mempelai Pria',data.groom||'Belum diisi'],['Mempelai Wanita',data.bride||'Belum diisi'],['Acara 1',data.event1||'Belum diisi'],['Acara 2',data.event2||'Belum diisi'],['Acara 3',data.event3||'Belum diisi'],['Jumlah Foto',String(data.files.length)]].forEach(function(pair){var d=document.createElement('div'),s=document.createElement('span'),v=document.createElement('strong');s.textContent=pair[0];v.textContent=pair[1];d.appendChild(s);d.appendChild(v);summary.appendChild(d);});fields.appendChild(summary);}
panel.appendChild(fields);error();
var back=btn('← Kembali','',function(){index=Math.max(-1,index-1);errors='';render();});
if(step.id==='review'){actions([back,btn('Simulasikan Pengajuan','primary',function(){submitted++;index=-2;renderSuccess();})]);}
else{actions([back,btn('Isi Nanti','soft',function(){index++;errors='';render();}),btn('Lanjut →','primary',function(){if(step.id==='product'&&!data.type){errors='Pilih jenis undangan terlebih dahulu.';return render();}if(step.id==='photo'&&!data.photo){errors='Pilih paket foto terlebih dahulu.';return render();}index++;errors='';render();})]);}
var helper=document.createElement('p');helper.className='help';helper.textContent='Ini hanya pratinjau. Data tidak tersimpan pada database.';panel.appendChild(helper);
}
function renderSuccess(){panel.replaceChildren();var mark=div('success');mark.innerHTML='<strong>Simulasi berhasil!</strong><br>Dalam website asli, data akan disimpan, lonceng admin bertambah, lalu WhatsApp admin terbuka. Di pratinjau ini tidak ada data yang dikirim.';panel.appendChild(mark);heading('Terima kasih!','Anda telah mencoba seluruh alur pengisian undangan.');actions([btn('Lihat Simulasi Admin','primary',renderAdmin),btn('Ulangi Pratinjau','',function(){index=-1;submitted=0;render();})]);document.getElementById('count').textContent=String(submitted);}
function renderAdmin(){adminView=true;panel.replaceChildren();heading('Pratinjau Dashboard Admin','Ini hanya simulasi. Tidak menampilkan atau menyimpan pesanan asli.','🔔 '+submitted+' PENGAJUAN BARU');var tip=div('tip');tip.textContent=submitted?'Nomor Pesanan: '+data.order+' · Status: Menunggu Pemeriksaan · WhatsApp: '+data.wa:'Belum ada pesanan simulasi masuk.';panel.appendChild(tip);actions([btn('Kembali ke Form','primary',function(){index=-1;render();})]);}
document.getElementById('admin').addEventListener('click',renderAdmin);render();
})();
</script></body></html>
